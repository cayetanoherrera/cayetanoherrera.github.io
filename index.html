<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cayetano Herrera López</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter', sans-serif;
    background:#f8f7f4;
}

/* ---------- HERO ---------- */

.hero{

    height:100vh;

    background:
    linear-gradient(
        rgba(20,30,25,0.45),
        rgba(20,30,25,0.45)
    ),
    url("hero.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    position:relative;
}

/* ---------- NAVBAR ---------- */

nav{

    position:absolute;
    top:0;
    left:0;
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:35px 60px;
}

.logo{

    color:white;
    font-size:1.3rem;
    font-weight:600;
    letter-spacing:1px;
}

.nav-links{

    display:flex;
    gap:35px;
}

.nav-links a{

    color:white;
    text-decoration:none;
    font-size:1rem;
    transition:0.3s;
}

.nav-links a:hover{

    color:#c9a227;
}

/* ---------- HERO TEXT ---------- */

.hero-content{

    height:100%;

    display:flex;
    justify-content:center;
    align-items:flex-start;
    flex-direction:column;

    max-width:700px;

    margin-left:12%;
}

.hero-content h1{

    font-family:'Playfair Display', serif;

    color:white;
    font-size:6rem;
    line-height:0.9;
    margin-bottom:30px;
}

.hero-content p{

    color:white;
    font-size:1.4rem;
    line-height:1.6;
    max-width:550px;
}

/* ---------- BUTTON ---------- */

.hero-button{

    display:inline-block;

    margin-top:40px;

    background:#c9a227;

    color:white;

    padding:15px 35px;

    text-decoration:none;

    border-radius:50px;

    transition:0.3s;
}

.hero-button:hover{

    background:#d56a2a;
}

/* ---------- MOBILE ---------- */

@media(max-width:900px){

.hero-content h1{

    font-size:4rem;
}

.hero-content{

    margin-left:8%;
    margin-right:8%;
}

.nav-links{

    gap:15px;
}

}

</style>

</head>

<body>

<section class="hero">

<nav>

<div class="logo">
C. Herrera
</div>

<div class="nav-links">
<a href="#about">About</a>
<a href="#research">Research</a>
<a href="#projects">Projects</a>
<a href="#publications">Publications</a>
<a href="#contact">Contact</a>
</div>

</nav>

<div class="hero-content">

<h1>
Cayetano<br>
Herrera
</h1>

<p>
Postdoctoral researcher studying biodiversity,
species interactions, pollinator ecology and
biological invasions in a changing world.
</p>

<a href="#about" class="hero-button">
Explore my research
</a>

</div>

</section>

</body>
</html>
